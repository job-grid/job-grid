# Supabase Edge Function JWT settings.
# Candidate submission is intentionally public and performs strict server-side validation,
# with private storage, rate limiting by email, and no direct table access.
[functions.submit-application]
verify_jwt = false

# Staff review requires a valid Supabase Auth JWT; the function additionally checks staff_roles.
[functions.staff-applications]
verify_jwt = true

# Vacancy management requires a valid Supabase Auth JWT and an explicit staff role.
[functions.staff-jobs]
verify_jwt = true

# Manual job submissions are public intake only; the function validates input and stores it privately.
[functions.job-submissions]
verify_jwt = false

# Staff review of private manual job submissions requires an authenticated staff role.
[functions.staff-job-submissions]
verify_jwt = true
