<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Recruitment Review — Job Grid</title><link rel="stylesheet" href="/styles/tokens.css" /><link rel="stylesheet" href="/styles/global.css" /><link rel="stylesheet" href="/styles/vacancies.css" /><script type="module" src="/scripts/components.js"></script><script type="module" src="/scripts/main.js"></script><script type="module" src="/scripts/staff.js"></script></head>
<body><a class="skip-link" href="#main">Skip to content</a><div id="top"></div><job-grid-header></job-grid-header>
<main id="main" class="section-wrap section-space">
<p class="eyebrow">Restricted staff workspace</p><h1>Recruitment review.</h1><p class="section-description">Only authorized Job Grid reviewers can access candidate profiles. Keep candidate information confidential and use it only for recruitment and matching.</p>
<section id="staff-login-panel" class="catalogue-notice"><strong>Staff sign-in</strong><form id="staff-login-form" class="vacancy-filters"><div class="filter-field"><label for="staff-email">Staff email</label><input id="staff-email" type="email" autocomplete="username" required maxlength="254" /></div><div class="filter-field"><label for="staff-password">Password</label><input id="staff-password" type="password" autocomplete="current-password" required /></div><div class="filter-actions"><button class="button button-primary" type="submit">Sign in</button></div></form><p id="staff-login-status" role="status" aria-live="polite"></p></section>
<section id="staff-workspace" hidden><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:1rem"><p id="staff-summary" role="status"></p><button id="staff-sign-out" class="button button-secondary" type="button">Sign out</button></div><div id="staff-applications" class="vacancy-grid" aria-live="polite"></div></section>
</main><job-grid-footer></job-grid-footer></body></html>
