      - name: Audit all positive Japan candidates against official historical boundary polygons
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-japan-estat"
          python -m pip install --disable-pip-version-check pyshp
          python -m py_compile scripts/geonames-japan-mlit-polygon-evidence-audit.py
          python tests/test_geonames_japan_mlit_polygon_evidence_audit.py
          python scripts/geonames-japan-mlit-polygon-evidence-audit.py \
            "$work/japan-estat-evidence-audit.json" \
            "$work/japan-mlit-polygon-audit" \
            --all-positive-candidates
          python -m json.tool "$work/japan-mlit-polygon-audit.json" >/dev/null
          python -m json.tool "$work/japan-mlit-polygon-audit.manifest.json" >/dev/null
          python - "$work/japan-estat-evidence-audit.json" "$work/japan-mlit-polygon-audit.json" "$work/japan-mlit-polygon-audit.csv" "$work/japan-mlit-polygon-audit.candidate-results.csv" "$work/japan-mlit-polygon-audit.target-summary.csv" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          estat_path, report_path, observations_path, candidate_path, target_summary_path = map(Path, sys.argv[1:])
          estat = json.loads(estat_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          with observations_path.open(encoding="utf-8", newline="") as stream:
              observations = list(csv.DictReader(stream))
          with candidate_path.open(encoding="utf-8", newline="") as stream:
              candidates = list(csv.DictReader(stream))
          with target_summary_path.open(encoding="utf-8", newline="") as stream:
              target_summaries = list(csv.DictReader(stream))

          positive_targets = [target for target in estat.get("target_results", []) if target.get("candidates")]
          expected_ids = {str(target["geonames_id"]) for target in positive_targets}
          expected_associations = sum(len(target["candidates"]) for target in positive_targets)
          expected_codes = {
              str(candidate["area_code"]).zfill(5)
              for target in positive_targets
              for candidate in target["candidates"]
          }
          expected_prefectures = {code[:2] for code in expected_codes}
          expected_archives = 3 * len(expected_prefectures) + 47

          if report.get("selection_mode") != "ALL_POSITIVE_ESTAT_LABEL_CANDIDATE_TARGETS":
              raise SystemExit(f"Unexpected polygon audit selection mode: {report.get('selection_mode')}")
          actual_ids = {str(target["geonames_id"]) for target in report.get("target_observations", [])}
          if report.get("target_count") != len(positive_targets) or actual_ids != expected_ids:
              raise SystemExit(
                  f"Expected all {len(expected_ids)} positive-label candidate targets; got {len(actual_ids)}"
              )
          if report.get("target_code_associations_tested") != expected_associations:
              raise SystemExit("Polygon audit target-to-code association count does not match the e-Stat candidate data.")
          if report.get("distinct_candidate_area_codes_tested") != len(expected_codes):
              raise SystemExit("Polygon audit distinct-area-code count does not match the e-Stat candidate data.")
          if report.get("source_snapshot_archive_count") != expected_archives or len(report.get("source_snapshots", [])) != expected_archives:
              raise SystemExit(f"Expected {expected_archives} verified boundary archives for all candidate prefectures and 1995 context.")
          if len(candidates) != expected_associations:
              raise SystemExit(f"Expected {expected_associations} target-to-candidate-code rows, got {len(candidates)}.")
          if not observations:
              raise SystemExit("Point-in-polygon observations CSV is empty.")
          if any(row.get("operational_parent_link_created", "").lower() != "false" for row in observations):
              raise SystemExit("Point-in-polygon observations violate the no-parent-write boundary.")
          if any(row.get("operational_parent_link_created", "").lower() != "false" for row in candidates):
              raise SystemExit("Point-in-polygon candidate dispositions violate the no-parent-write boundary.")
          if report.get("operational_parent_links_created") != 0:
              raise SystemExit("Polygon audit violated the no-parent-write boundary.")
          if any(len(item.get("archive_sha256", "")) != 64 for item in report["source_snapshots"]):
              raise SystemExit("At least one historical polygon archive lacks a SHA-256 fingerprint.")
          expected_collision_ids = {"1851030", "1851031", "1859673", "1865064", "1865066", "1865067"}
          target_observation_map = {str(target["geonames_id"]): target for target in report["target_observations"]}
          observed_ids = {
              target_id for target_id, target in target_observation_map.items()
              if target.get("polygon_observations")
          }
          if not expected_collision_ids.issubset(observed_ids):
              raise SystemExit("One or more of the six original collision targets lost required polygon context.")
          if len(target_summaries) != len(positive_targets):
              raise SystemExit("Target summary CSV must preserve all positive-candidate target rows.")
          if {row["geonames_id"] for row in target_summaries} != expected_ids:
              raise SystemExit("Target summary CSV IDs do not match source-derived positive-candidate IDs.")
          summary_missing = {
              row["geonames_id"] for row in target_summaries
              if row.get("polygon_context_status") != "CONTAINING_POLYGON_OBSERVED"
          }
          if summary_missing != set(report.get("target_ids_without_polygon_context", [])):
              raise SystemExit("Target summary unresolved spatial-context IDs do not match JSON.")
          print(
              "Targets without polygon context in selected snapshots: "
              + (", ".join(sorted(summary_missing)) if summary_missing else "none")
              + "; these remain unresolved and were not omitted."
          )

          candidate_codes_with_point_hit = sum(
              bool(row["point_inside_candidate_polygon_snapshots"]) for row in candidates
          )
          print(
              f"Validated official polygon audit: {report['target_count']} positive-candidate targets; "
              f"{report['source_snapshot_archive_count']} archives; {len(observations)} containment rows; "
              f"{len(candidates)} target-code rows; {len(target_summaries)} target-summary rows; zero parent links."
          )
          print("## Japan positive-candidate point-in-polygon evidence")
          print(f"- Positive e-Stat candidate targets selected: {report['target_count']}/{len(positive_targets)}")
          print(f"- Targets with containing-polygon context: {report['target_rows_with_polygon_context']}/{report['target_count']}")
          print(f"- Targets without containing-polygon context: {report['target_rows_without_polygon_context']}")
          print(f"- Historical/current MLIT boundary archives retrieved and CRC-checked: {report['source_snapshot_archive_count']}")
          print(f"- Distinct e-Stat candidate area codes inspected: {len(expected_codes)}")
          print(f"- Target-to-candidate-code associations inspected: {len(candidates)}")
          print(f"- Candidate associations with a point inside the candidate polygon: {candidate_codes_with_point_hit}")
          print("## Positive containment associations (candidate review only)")
          for row in sorted(candidates, key=lambda item: (int(item["geonames_id"]), item["candidate_code"])):
              snapshots = row.get("point_inside_candidate_polygon_snapshots", "")
              if snapshots:
                  print(
                      f"- GeoNames ID {row['geonames_id']} ({row['geonames_name']}) -> "
                      f"candidate area code {row['candidate_code']}; contained snapshot(s): {snapshots}"
                  )
          print("## Official e-Stat period history for positive spatial associations (evidence only)")
          estat_targets = {str(target["geonames_id"]): target for target in estat.get("target_results", [])}
          for spatial_row in sorted(candidates, key=lambda item: (int(item["geonames_id"]), item["candidate_code"])):
              snapshots = spatial_row.get("point_inside_candidate_polygon_snapshots", "")
              if not snapshots:
                  continue
              target = estat_targets.get(str(spatial_row["geonames_id"]))
              if target is None or target.get("source_identity_and_raw_codes_verified") is not True:
                  raise SystemExit(f"Positive spatial row lacks source-verified e-Stat target {spatial_row['geonames_id']}.")
              candidate = next(
                  (item for item in target.get("candidates", [])
                   if str(item.get("area_code", "")).zfill(5) == str(spatial_row["candidate_code"]).zfill(5)),
                  None,
              )
              if candidate is None:
                  raise SystemExit(
                      f"Positive spatial row is not present in source candidate evidence: "
                      f"{spatial_row['geonames_id']} / {spatial_row['candidate_code']}"
                  )
              detail = {
                  "geonames_id": str(spatial_row["geonames_id"]),
                  "geonames_name": spatial_row["geonames_name"],
                  "candidate_area_code": spatial_row["candidate_code"],
                  "point_inside_candidate_polygon_snapshots": snapshots,
                  "candidate_exact_matching_period_count": candidate.get("exact_matching_period_count"),
                  "candidate_history_period_count": candidate.get("history_period_count"),
                  "periods": [
                      {
                          "effective_from": period.get("effective_from", ""),
                          "effective_until": period.get("effective_until", ""),
                          "label_en": period.get("label_en", ""),
                          "label_ja": period.get("label_ja", ""),
                          "matches_target_name": period.get("matches_target_name"),
                          "parent_references": period.get("parent_references", []),
                          "previous_period_uris": period.get("previous_period_uris", []),
                          "succeeding_period_uris": period.get("succeeding_period_uris", []),
                          "administrative_class_uris": period.get("administrative_class_uris", []),
                      }
                      for period in candidate.get("periods", [])
                  ],
              }
              print(json.dumps(detail, ensure_ascii=False, sort_keys=True))
          print("## Targets without containing-polygon context (remain unresolved)")
          for row in sorted(target_summaries, key=lambda item: int(item["geonames_id"])):
              if row.get("polygon_context_status") != "CONTAINING_POLYGON_OBSERVED":
                  print(f"- GeoNames ID {row['geonames_id']} ({row['geonames_name']})")
          print("- Positive containment remains candidate evidence; missing context remains unresolved; no parent links approved.")
          PY

      - name: Spatial-first 1995 audit of all 126 Japan targets (candidate evidence only)
