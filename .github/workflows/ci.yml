  geonames-crosswalk-exception-source-audit:
    name: Phase 0 CI / Global source audit of crosswalk exceptions
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 27) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Retrieve and fingerprint official global GeoNames archive
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          mkdir -p "$work"
          url="https://download.geonames.org/export/dump/allCountries.zip"
          archive="$work/allCountries.zip"
          headers="$work/allCountries.headers"
          status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors \
            --dump-header "$headers" --output "$archive" --write-out '%{http_code}' "$url")"
          test "$status" = "200"
          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test -s "$archive"
          unzip -tq "$archive"

          python - "$headers" "$archive" "$url" "$retrieved_at" "$status" "$work/source-manifest.json" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          headers_path, archive_path, url, retrieved_at, status, manifest_path = sys.argv[1:]
          raw_headers = Path(headers_path).read_text(encoding="iso-8859-1", errors="replace")
          last_block = {}
          current = {}
          current_status = None
          for line in raw_headers.replace("\r\n", "\n").split("\n"):
              if line.startswith("HTTP/"):
                  if current_status == "200":
                      last_block = current
                  pieces = line.split()
                  current_status = pieces[1] if len(pieces) > 1 else None
                  current = {}
              elif ":" in line and current_status:
                  key, value = line.split(":", 1)
                  current[key.strip().lower()] = value.strip()
          if current_status == "200":
              last_block = current

          archive = Path(archive_path)
          last_modified_raw = last_block.get("last-modified")
          last_modified_utc = None
          if last_modified_raw:
              try:
                  dt = parsedate_to_datetime(last_modified_raw)
                  if dt.tzinfo is not None:
                      last_modified_utc = dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
              except (TypeError, ValueError, OverflowError):
                  pass

          record = {
              "country_code": "WORLD",
              "archive_filename": archive.name,
              "source_url": url,
              "retrieved_at_utc": retrieved_at,
              "http_status": int(status),
              "http_last_modified_header": last_modified_raw,
              "http_last_modified_utc": last_modified_utc,
              "etag": last_block.get("etag"),
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archive_size_bytes": archive.stat().st_size,
              "zip_crc_validation": "PASS",
          }
          Path(manifest_path).write_text(
              json.dumps({"manifest_version": 1, "remote_sources": [record]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({key: record[key] for key in [
              "source_url", "retrieved_at_utc", "http_status",
              "http_last_modified_utc", "etag", "archive_sha256",
              "archive_size_bytes", "zip_crc_validation"
          ]}))
          PY

          mkdir -p "$work/extracted"
          unzip -oq "$archive" -d "$work/extracted"
          test -s "$work/extracted/allCountries.txt"

      - name: Run source-pinned GeoNames country-master identity audit
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash scripts/geonames-country-master-ci-audit.sh "$RUNNER_TEMP_DIR/geonames-world-source"

      - name: Test worldwide exact-code parent index
        run: python3 -m unittest discover -s tests -p "test_geonames_destination_parent_code_index.py" -v

      - name: Test worldwide destination candidate exporter
        run: python3 -m unittest discover -s tests -p "test_geonames_destination_candidate_export.py" -v

      - name: Export source-pinned worldwide destination candidates (not operational)
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          audit="$work/country-master-audit"
          python3 scripts/geonames-destination-candidate-export.py \
            --all-countries-text "$work/extracted/allCountries.txt" \
            --country-info "$work/countryInfo.txt" \
            --country-info-manifest "$audit/country-master-source-manifest.json" \
            --country-master-audit "$audit/geonames-country-catalog-aggregate.json" \
            --exception-dispositions docs/geonames-un-m49-exception-dispositions-2026-10-12.json \
            --output-dir "$audit/destination-candidates" \
            | tee "$audit/destination-candidate-export.stdout.json"
          python3 - "$audit/destination-candidates/worldwide-geonames-destination-candidate-export-summary.json" "$audit/geonames-country-catalog-aggregate.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          master=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          counts=report["counts"]
          if report.get("status")!="PASS_SOURCE_SCOPE_RECONCILED__CANDIDATES_ONLY__NOT_IMPORTED":
              raise SystemExit("Worldwide destination candidate package did not pass.")
          if counts.get("allcountries_source_rows_scanned") != master.get("counts",{}).get("all_countries_rows_scanned"):
              raise SystemExit("Destination exporter row count does not match the pinned source audit.")
          if counts.get("candidate_file_rows") != counts.get("destination_scope_rows"):
              raise SystemExit("Destination candidate scope rows do not reconcile to the output file.")
          if counts.get("duplicate_candidate_geonames_ids") != 0 or counts.get("invalid_candidate_ids") != 0 or counts.get("malformed_source_lines") != 0:
              raise SystemExit("Duplicate/invalid/malformed destination candidate records block acceptance.")
          if counts.get("operational_selectable_rows") != 0 or counts.get("parent_links_created") != 0:
              raise SystemExit("Safety boundary violation: candidate export must not enable selections or create parent links.")
          print("## Worldwide GeoNames destination candidate export (source scope only)")
          print(f"- Source rows streamed: {counts['allcountries_source_rows_scanned']}")
          print(f"- In-scope place/admin rows accounted for: {counts['destination_scope_rows']}")
          print(f"- Candidate export rows: {counts['candidate_file_rows']}")
          print(f"- Duplicate IDs / invalid IDs / malformed lines: {counts['duplicate_candidate_geonames_ids']} / {counts['invalid_candidate_ids']} / {counts['malformed_source_lines']}")
          print(f"- Current place/admin candidate rows: {sum(v for k,v in counts['disposition_totals'].items() if k in {'CURRENT_PLACE_CANDIDATE','CURRENT_ADMINISTRATIVE_AREA_CANDIDATE'})}")
          print(f"- Source rows held for explicit review: {sum(v for k,v in counts['disposition_totals'].items() if k not in {'CURRENT_PLACE_CANDIDATE','CURRENT_ADMINISTRATIVE_AREA_CANDIDATE'})}")
          print("- Country assignment and parent links remain unapproved; operationally selectable rows: 0.")
          print("- The compressed row-level candidate file is a review/import artifact, not a database seed.")
          PY

      - name: Export source-pinned worldwide administrative parent code candidates
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          output="$work/country-master-audit/destination-candidates"
          python3 scripts/geonames-destination-parent-code-index.py \
            --candidate-gzip "$output/worldwide-geonames-destination-candidates.csv.gz" \
            --candidate-summary "$output/worldwide-geonames-destination-candidate-export-summary.json" \
            --output-dir "$output" \
            | tee "$work/parent-code-index.stdout.json"
          python3 - "$output/worldwide-geonames-admin-parent-code-candidate-summary.json" "$output/worldwide-geonames-destination-candidate-export-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidates=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          c=report["counts"]
          if report.get("status")!="PASS_SOURCE_CODE_PARENT_CANDIDATES_EXPORTED__REVIEW_ONLY__NO_LINKS":
              raise SystemExit("Admin parent code-index status is not a review-only pass.")
          if c.get("candidate_source_rows")!=candidates.get("counts",{}).get("candidate_file_rows"):
              raise SystemExit("Parent resolver input count does not equal the candidate export.")
          if c.get("parent_resolution_rows_written")!=c.get("candidate_source_rows") or c.get("rows_not_accounted_for")!=0:
              raise SystemExit("Parent resolver failed to account for every candidate row.")
          if sum(c.get("direct_parent_resolution_status_totals",{}).values())!=c.get("candidate_source_rows"):
              raise SystemExit("Direct parent status totals do not reconcile.")
          if sum(c.get("parent_path_status_totals",{}).values())!=c.get("candidate_source_rows"):
              raise SystemExit("Parent path status totals do not reconcile.")
          if report.get("sources",{}).get("candidate_export_sha256")!=candidates.get("sources",{}).get("candidate_export_sha256"):
              raise SystemExit("Parent resolver candidate SHA-256 differs from the source-pinned candidate export.")
          if c.get("operational_parent_links_created")!=0 or c.get("operational_selectable_rows")!=0 or c.get("database_or_production_changes") is not False:
              raise SystemExit("Parent-code audit crossed the no-write boundary.")
          print("## Worldwide source-code parent path candidates")
          print(f"- Candidate rows and parent-resolution rows: {c['candidate_source_rows']} / {c['parent_resolution_rows_written']}")
          print(f"- Current ADM1–ADM4 source rows indexed: {c['admin_rows_indexed']}")
          print(f"- Unique direct source-code parent candidates: {c['rows_with_unique_direct_parent_candidate']}")
          print(f"- Ambiguous direct composite keys: {c['rows_with_ambiguous_direct_parent_key']}")
          print(f"- Missing/blocked direct composite keys: {c['rows_with_missing_or_blocked_direct_parent_key']}")
          print(f"- Rows with a complete source-code chain candidate: {sum(v for k,v in c['parent_path_status_totals'].items() if k.startswith('SOURCE_CODE_CHAIN_COMPLETE'))}")
          print("- All hierarchy results remain candidate evidence; operational parent links and selectable rows remain zero.")
          PY

      - name: Test worldwide destination alias exporter
        run: python3 -m unittest discover -s tests -p "test_geonames_alternate_names_candidate_export.py" -v

      - name: Retrieve, fingerprint and CRC-check official alternateNamesV2 archive
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          alias_work="$work/alternate-names"
          mkdir -p "$alias_work"
          url="https://download.geonames.org/export/dump/alternateNamesV2.zip"
          archive="$alias_work/alternateNamesV2.zip"
          headers="$alias_work/alternateNamesV2.headers"
          status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors \
            --dump-header "$headers" --output "$archive" --write-out '%{http_code}' "$url")"
          test "$status" = "200"
          test -s "$archive"
          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$headers" "$archive" "$url" "$retrieved_at" "$status" "$alias_work/source-manifest.json" <<'PY'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          headers_path, archive_path, url, retrieved, status, manifest_path = sys.argv[1:]
          hp=Path(headers_path).read_text(encoding="iso-8859-1",errors="replace")
          blocks=[]; current={}; code=None
          for line in hp.replace("\r\n","\n").split("\n"):
              if line.startswith("HTTP/"):
                  if code=="200": blocks.append(current)
                  p=line.split(); code=p[1] if len(p)>1 else None; current={}
              elif ":" in line and code:
                  k,v=line.split(":",1); current[k.strip().lower()]=v.strip()
          if code=="200": blocks.append(current)
          h=blocks[-1] if blocks else {}
          p=Path(archive_path); source_digest=hashlib.sha256()
          with p.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024*1024), b""):
                  source_digest.update(chunk)
          with zipfile.ZipFile(p,"r") as z:
              hits=[n for n in z.namelist() if n=="alternateNamesV2.txt" or n.endswith("/alternateNamesV2.txt")]
              if len(hits)!=1:
                  raise SystemExit("Expected exactly one alternateNamesV2.txt archive member.")
              bad=z.testzip()
              if bad:
                  raise SystemExit("ZIP CRC test failed for member "+bad)
              info=z.getinfo(hits[0])
          record={"source_url":url,"retrieved_at_utc":retrieved,"http_status":int(status),
              "http_last_modified_header":h.get("last-modified"),"etag":h.get("etag"),
              "size_bytes":p.stat().st_size,"sha256":source_digest.hexdigest(),
              "zip_crc_validation":"PASS","member_name":info.filename,"member_uncompressed_size_bytes":info.file_size}
          Path(manifest_path).write_text(json.dumps({"manifest_version":1,"remote_source":record},indent=2)+"\n",encoding="utf-8")
          print(json.dumps(record,indent=2))
          PY

      - name: Export source-pinned multilingual names for destination candidates
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          audit="$work/country-master-audit"
          alias_work="$work/alternate-names"
          output="$audit/destination-candidates"
          python3 scripts/geonames-alternate-names-candidate-export.py \
            --candidate-gzip "$output/worldwide-geonames-destination-candidates.csv.gz" \
            --country-info "$work/countryInfo.txt" \
            --country-info-manifest "$audit/country-master-source-manifest.json" \
            --archive "$alias_work/alternateNamesV2.zip" \
            --source-manifest "$alias_work/source-manifest.json" \
            --output-dir "$output" \
            | tee "$alias_work/alternate-name-export.stdout.json"
          python3 - "$output/worldwide-geonames-country-and-destination-alternate-name-summary.json" "$output/worldwide-geonames-destination-candidate-export-summary.json" "$audit/geonames-country-catalog-aggregate.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv,hashlib,json,sys
          from pathlib import Path
          aliases=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidates=json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          country_master=json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          c=aliases["counts"]
          master_counts=country_master.get("counts",{})
          expected_country_area_rows=master_counts.get("country_info_rows")
          expected_country_sha=country_master.get("sources",{}).get("country_info",{}).get("sha256")
          allowed_alias_statuses = {
              "PASS_ALIAS_SCOPE_RECONCILED__CANDIDATES_ONLY__NOT_IMPORTED",
              "PASS_ALIAS_SCOPE_RECONCILED_WITH_QUARANTINE__CANDIDATES_ONLY__NOT_IMPORTED",
          }
          if aliases.get("status") not in allowed_alias_statuses:
              raise SystemExit("Destination alias export did not pass an approved source-only status.")
          if c.get("destination_candidate_ids")!=candidates.get("counts",{}).get("candidate_file_rows"):
              raise SystemExit("Alias destination IDs do not equal unique destination candidate input.")
          if not isinstance(expected_country_area_rows,int) or expected_country_area_rows<=0:
              raise SystemExit("Pinned country-master audit has no valid countryInfo row count.")
          if c.get("country_area_source_ids")!=expected_country_area_rows:
              raise SystemExit("Alias audit country/area ID count does not match the pinned countryInfo source.")
          country_source=aliases.get("sources",{}).get("country_info_source",{})
          if not expected_country_sha or country_source.get("sha256")!=expected_country_sha:
              raise SystemExit("Alias audit countryInfo SHA-256 does not match the source-pinned country-master audit.")
          if sum(int(row.get("source_scope_records",0)) for row in aliases.get("per_country_area_alpha2",[]))!=expected_country_area_rows:
              raise SystemExit("Per-alpha-2 country/area coverage rows do not reconcile to countryInfo.")
          if sum(int(row.get("source_scope_records",0)) for row in aliases.get("per_source_country_code",[]))!=c.get("destination_candidate_ids"):
              raise SystemExit("Per-source-country destination coverage rows do not reconcile to candidate input.")
          if c.get("source_scope_record_ids")!=c.get("destination_candidate_ids",0)+c.get("country_area_source_ids",0):
              raise SystemExit("Combined alias source scope does not reconcile.")
          quarantine_path = Path(sys.argv[2]).parent / "worldwide-geonames-country-and-destination-alternate-name-quarantine.csv"
          with quarantine_path.open(encoding="utf-8", newline="") as stream:
              quarantine_rows = list(csv.DictReader(stream))
          expected_quarantined = c.get("malformed_or_invalid_source_rows", -1) + c.get("invalid_boolean_flag_rows", -1)
          if c.get("quarantined_source_rows") != expected_quarantined or len(quarantine_rows) != expected_quarantined:
              raise SystemExit("Alternate-name malformed/invalid row counts do not reconcile to row-level quarantine.")
          if sum(c.get("quarantine_rows_by_reason", {}).values()) != expected_quarantined:
              raise SystemExit("Alternate-name quarantine reason totals do not reconcile.")
          if aliases.get("sources", {}).get("quarantine_file_sha256") != hashlib.sha256(quarantine_path.read_bytes()).hexdigest():
              raise SystemExit("Alternate-name quarantine bytes do not match their source manifest hash.")
          if expected_quarantined == 0 and aliases.get("status") != "PASS_ALIAS_SCOPE_RECONCILED__CANDIDATES_ONLY__NOT_IMPORTED":
              raise SystemExit("Clean alias source should use the no-quarantine pass status.")
          if expected_quarantined > 0 and aliases.get("status") != "PASS_ALIAS_SCOPE_RECONCILED_WITH_QUARANTINE__CANDIDATES_ONLY__NOT_IMPORTED":
              raise SystemExit("Quarantined alias source must have an explicit quarantine status.")
          if c.get("duplicate_matching_alternate_name_ids")!=0:
              raise SystemExit("Duplicate matching alternateName IDs block alias acceptance.")
          destination_alias_rows=sum(int(row.get("matching_alias_rows",0)) for row in aliases.get("per_source_country_code",[]))
          country_alias_rows=sum(int(row.get("matching_alias_rows",0)) for row in aliases.get("per_country_area_alpha2",[]))
          if destination_alias_rows+country_alias_rows!=c.get("matching_alias_rows_exported"):
              raise SystemExit("Destination and country/area alias row totals do not reconcile.")
          if c.get("matching_alias_rows_exported")!=c.get("unique_matching_alternate_name_ids"):
              raise SystemExit("Alias row count does not reconcile to unique alias IDs.")
          if c.get("operational_selectable_rows")!=0 or aliases.get("interpretation",{}).get("database_or_production_changes") is not False:
              raise SystemExit("Alias export violated no-production-write boundary.")
          print("## Worldwide destination alternate-name coverage")
          print(f"- Destination candidates checked: {c['destination_candidate_ids']}")
          print(f"- Destination candidates with aliases: {c['candidate_ids_with_aliases']}")
          print(f"- Destination candidates without aliases: {c['candidate_ids_without_aliases']}")
          print(f"- Country/area source records: {c['country_area_source_ids']}")
          print(f"- Country/area source records with aliases: {c['country_area_source_ids_with_aliases']}")
          print(f"- Country/area source records without aliases: {c['country_area_source_ids_without_aliases']}")
          print(f"- Alias rows exported: {c['matching_alias_rows_exported']}")
          print(f"- Language codes represented: {c['language_codes_in_export']}")
          print(f"- Malformed rows/flags and duplicate alias IDs: {c['malformed_or_invalid_source_rows']} / {c['invalid_boolean_flag_rows']} / {c['duplicate_matching_alternate_name_ids']}")
          print("- Rows remain source evidence only; no operational selections, internal identity matches or parent links were created.")
          PY

      - name: Compare all unique crosswalk exception IDs against the official global source
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-world-source"
          node scripts/geonames-crosswalk-exception-source-audit.mjs \
            "$work/extracted/allCountries.txt" \
            docs/geonames-sample-validation/results/crosswalk-reconciliation-20261010/owner-approved-dispositions.csv \
            "$RUNNER_TEMP_DIR/geonames-crosswalk-exception-source-audit" \
            "$work/source-manifest.json"
          cat "$RUNNER_TEMP_DIR/geonames-crosswalk-exception-source-audit.json" | tee -a "$GITHUB_STEP_SUMMARY"
          python - "$RUNNER_TEMP_DIR/geonames-crosswalk-exception-source-audit.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("unique_exception_ids") != 2416:
              raise SystemExit("Expected 2,416 unique exception IDs, got " + str(report.get("unique_exception_ids")))
          if report.get("input", {}).get("remote_retrieval_metadata_verified") is not True:
              raise SystemExit("Official global-source retrieval metadata did not validate.")
          if report.get("input", {}).get("malformed_or_wrong_shape_source_lines") != 0:
              raise SystemExit("Global GeoNames source contained malformed/wrong-shape rows.")
          if report.get("parent_ids_or_links_assigned") != 0:
              raise SystemExit("Safety boundary violation: parent IDs or links must remain zero.")
          coverage = report.get("input", {}).get("source_country_code_coverage", {})
          source_rows = coverage.get("rows_with_19_fields_and_nonempty_id")
          if coverage.get("aggregate_totals_match_source_row_count") is not True:
              raise SystemExit("Country-code/feature-class aggregate totals do not reconcile.")
          if coverage.get("country_code_bucket_record_total") != source_rows:
              raise SystemExit("Country-code bucket count total does not match source row count.")
          if coverage.get("feature_class_record_total") != source_rows:
              raise SystemExit("Feature-class count total does not match source row count.")
          if sum(coverage.get("country_code_record_counts", {}).values()) != source_rows:
              raise SystemExit("Persisted raw country-code bucket frequencies do not reconcile.")
          if sum(coverage.get("feature_class_record_counts", {}).values()) != source_rows:
              raise SystemExit("Feature-class frequencies do not reconcile.")
          accounted = report.get("source_identity_and_raw_codes_match", 0) + report.get("blocked_or_drifted_ids", 0)
          if accounted != report.get("unique_exception_ids"):
              raise SystemExit("Every unique exception ID must have a source audit disposition.")
          print("Global source audit complete; all exceptions have a row-level disposition and no parent links were written.")
          PY

      - name: Upload row-level global source audit and retrieval manifest (no source archive)
        uses: actions/upload-artifact@v4
        with:
          name: geonames-global-exception-source-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/geonames-crosswalk-exception-source-audit.csv
            ${{ runner.temp }}/geonames-crosswalk-exception-source-audit.json
            ${{ runner.temp }}/geonames-world-source/source-manifest.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/geonames-country-catalog-aggregate.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/geonames-destination-source-coverage.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/geonames-destination-coverage-by-source-country.csv
            ${{ runner.temp }}/geonames-world-source/country-master-audit/country-master-source-manifest.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-destination-candidates.csv.gz
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-destination-candidate-export-summary.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-admin-code-parent-index.csv.gz
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-destination-parent-code-resolutions.csv.gz
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-admin-parent-code-candidate-summary.json
            ${{ runner.temp }}/geonames-world-source/alternate-names/source-manifest.json
            ${{ runner.temp }}/geonames-world-source/alternate-names/alternate-name-export.stdout.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-country-and-destination-alternate-names.csv.gz
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-country-and-destination-alternate-name-summary.json
            ${{ runner.temp }}/geonames-world-source/country-master-audit/destination-candidates/worldwide-geonames-country-and-destination-alternate-name-quarantine.csv
          if-no-files-found: error
          retention-days: 7

  geonames-kenya-legacy-admin1-crosswalk-audit:
    name: Phase 0 CI / Kenya legacy admin1 crosswalk audit
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 27) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Retrieve and fingerprint current official GeoNames admin1 crosswalk
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-kenya-admin1"
          mkdir -p "$work"
          url="https://download.geonames.org/export/dump/admin1CodesASCII.txt"
          source="$work/admin1CodesASCII.txt"
          headers="$work/admin1CodesASCII.headers"
          status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors \
            --dump-header "$headers" --output "$source" --write-out '%{http_code}' "$url")"
          test "$status" = "200"
          retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test -s "$source"

          python - "$headers" "$source" "$url" "$retrieved_at" "$status" "$work/source-manifest.json" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          headers_path, source_path, url, retrieved_at, status, manifest_path = sys.argv[1:]
          raw_headers = Path(headers_path).read_text(encoding="iso-8859-1", errors="replace")
          last_block = {}
          current = {}
          current_status = None
          for line in raw_headers.replace("\r\n", "\n").split("\n"):
              if line.startswith("HTTP/"):
                  if current_status == "200":
                      last_block = current
                  pieces = line.split()
                  current_status = pieces[1] if len(pieces) > 1 else None
                  current = {}
              elif ":" in line and current_status:
                  key, value = line.split(":", 1)
                  current[key.strip().lower()] = value.strip()
          if current_status == "200":
              last_block = current

          path = Path(source_path)
          last_modified_raw = last_block.get("last-modified")
          last_modified_utc = None
          if last_modified_raw:
              try:
                  dt = parsedate_to_datetime(last_modified_raw)
                  if dt.tzinfo is not None:
                      last_modified_utc = dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
              except (TypeError, ValueError, OverflowError):
                  pass
          record = {
              "filename": path.name,
              "url": url,
              "retrieved_at_utc": retrieved_at,
              "http_status": int(status),
              "http_last_modified_header": last_modified_raw,
              "http_last_modified_utc": last_modified_utc,
              "etag": last_block.get("etag"),
              "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              "size_bytes": path.stat().st_size,
          }
          Path(manifest_path).write_text(
              json.dumps({"manifest_version": 1, "remote_source": record}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record))
          PY

      - name: Audit exact KE.01 and KE.03 crosswalk keys without inferring replacements
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/geonames-kenya-admin1"
          node scripts/geonames-kenya-legacy-admin1-crosswalk-audit.mjs \
            "$work/admin1CodesASCII.txt" \
            "$RUNNER_TEMP_DIR/kenya-legacy-admin1-crosswalk-audit" \
            "$work/source-manifest.json"
          cat "$RUNNER_TEMP_DIR/kenya-legacy-admin1-crosswalk-audit.json" | tee -a "$GITHUB_STEP_SUMMARY"
          python - "$RUNNER_TEMP_DIR/kenya-legacy-admin1-crosswalk-audit.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("target_count") != 2:
              raise SystemExit("Expected the two known Kenya legacy-code targets.")
          if report.get("source", {}).get("retrieval_metadata_verified") is not True:
              raise SystemExit("Official admin1 crosswalk retrieval metadata did not validate.")
          if report.get("malformed_rows") != 0:
              raise SystemExit("Official admin1 crosswalk contained malformed rows.")
          if report.get("candidate_parent_ids_assigned") != 0 or report.get("operational_parent_links_created") != 0:
              raise SystemExit("Safety boundary violation: no parent IDs or links may be assigned here.")
          if len(report.get("targets", [])) != 2:
              raise SystemExit("Both legacy-code targets need explicit row-level disposition.")
          print("Kenya legacy-key audit complete; replacement parentage remains unresolved unless separately evidenced and approved.")
          PY

      - name: Build source-pinned Kenya crosswalk rebuild ledger (one verified override)
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR"
          node --test tests/geonames-kenya-crosswalk-rebuild-ledger.test.mjs
          node scripts/geonames-kenya-crosswalk-rebuild-ledger.mjs \
            "$work/kenya-legacy-admin1-crosswalk-audit.json" \
            docs/geonames-kenya-external-ancestor-evidence-2026-10-11.json \
            docs/geonames-kenya-current-unit-evidence-2026-10-12.json \
            docs/geonames-kenya-admin1-parent-override-2026-10-12.json \
            docs/geonames-sample-validation/results/crosswalk-reconciliation-20261010/initial-operational-admin-catalog-exclusions.csv \
            "$work/kenya-crosswalk-rebuild-ledger"
          python - "$work/kenya-crosswalk-rebuild-ledger.json" "$work/kenya-crosswalk-rebuild-ledger.effective-initial-admin-catalog-exclusions.csv" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          totals = report.get("totals", {})
          if report.get("status") != "ONE_PARENT_PATH_VERIFIED__ONE_PARENT_PATH_BLOCKED":
              raise SystemExit("Unexpected Kenya ledger status.")
          expected = {
              "target_rows": 2,
              "official_native_parent_paths_documented": 2,
              "source_backed_parent_overrides_approved": 1,
              "immediate_parent_paths_verified": 1,
              "eligible_from_kenya_exception_set": 1,
              "excluded_pending_parent_crosswalk": 1,
              "raw_admin1_codes_changed": 0,
              "operational_parent_links_created": 0,
          }
          for key, value in expected.items():
              if totals.get(key) != value:
                  raise SystemExit(f"Kenya ledger total {key} expected {value}, got {totals.get(key)}.")
          records = {str(row.get("geonames_id")): row for row in report.get("records", [])}
          if set(records) != {"192705", "7800132"}:
              raise SystemExit("The ledger does not preserve the two exact Kenya targets.")
          if records["7800132"].get("immediate_parent_geonames_id") != "186824" or records["7800132"].get("complete_parent_path_verified") is not True:
              raise SystemExit("The Imenti source-backed parent override is missing.")
          if records["192705"].get("immediate_parent_geonames_id") is not None or records["192705"].get("complete_parent_path_verified") is not False:
              raise SystemExit("Kiambururu must remain blocked pending the Githunguri Sub-County mapping.")
          if any(row.get("operational_parent_link_created") is not False for row in records.values()):
              raise SystemExit("Evidence CI must not create live parent links.")
          with Path(sys.argv[2]).open(encoding="utf-8", newline="") as stream:
              effective = list(csv.DictReader(stream))
          if len(effective) != 125:
              raise SystemExit("Combined effective exclusion overlay must contain 125 rows.")
          re_admitted = {"1850471", "1850496", "7800132"}
          if any(row["geonames_id"] in re_admitted for row in effective) or not any(row["geonames_id"] == "192705" for row in effective):
              raise SystemExit("Effective overlay must re-admit only Imenti, Tawaramoto and Tatsuno; Kiambururu remains excluded.")
          if sum(row["country_code"] == "JP" for row in effective) != 124 or sum(row["country_code"] == "KE" for row in effective) != 1:
              raise SystemExit("Effective overlay geographic counts do not reconcile.")
          print("Combined overlay validated: Imenti, Tawaramoto and Tatsuno proposed for inclusion; Kiambururu and 124 Japan records remain excluded; zero live parent links.")
          PY
      - name: Upload Kenya legacy-code audit and retrieval manifest
        uses: actions/upload-artifact@v4
        with:
          name: geonames-kenya-legacy-admin1-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kenya-legacy-admin1-crosswalk-audit.csv
            ${{ runner.temp }}/kenya-legacy-admin1-crosswalk-audit.json
            ${{ runner.temp }}/geonames-kenya-admin1/source-manifest.json
            ${{ runner.temp }}/kenya-crosswalk-rebuild-ledger.csv
            ${{ runner.temp }}/kenya-crosswalk-rebuild-ledger.json
            ${{ runner.temp }}/kenya-crosswalk-rebuild-ledger.effective-initial-admin-catalog-exclusions.csv
            docs/geonames-kenya-admin1-parent-override-2026-10-12.json
            docs/geonames-sample-validation/results/crosswalk-reconciliation-20261010/kenya-admin1-parent-overrides-2026-10-12.csv
            docs/geonames-sample-validation/results/crosswalk-reconciliation-20261010/effective-initial-operational-admin-catalog-exclusions-2026-10-12.csv
          if-no-files-found: error
          retention-days: 7

  country-area-code-crosswalk-audit:
    name: Phase 0 CI / Country-area code crosswalk audit
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 27) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Retrieve and fingerprint official GeoNames and UN sources
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/country-area-code-audit"
          mkdir -p "$work"
          geo_url="https://download.geonames.org/export/dump/countryInfo.txt"
          m49_url="https://unstats.un.org/unsd/methodology/m49/overview/"
          geo="$work/countryInfo.txt"
          m49="$work/un-m49-overview.html"
          geo_headers="$work/countryInfo.headers"
          m49_headers="$work/un-m49.headers"
          geo_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          geo_status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors --dump-header "$geo_headers" --output "$geo" --write-out '%{http_code}' "$geo_url")"
          test "$geo_status" = "200"
          m49_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          m49_status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors --dump-header "$m49_headers" --output "$m49" --write-out '%{http_code}' "$m49_url")"
          test "$m49_status" = "200"
          test -s "$geo" && test -s "$m49"
          python3 - "$geo" "$geo_headers" "$geo_url" "$geo_time" "$geo_status" "$m49" "$m49_headers" "$m49_url" "$m49_time" "$m49_status" "$work/source-manifest.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          def record(path_arg, headers_arg, url, retrieved, status, key):
              p=Path(path_arg); raw=Path(headers_arg).read_text(encoding="iso-8859-1",errors="replace")
              blocks=[]; current={}; code=None
              for line in raw.replace("\r\n","\n").split("\n"):
                  if line.startswith("HTTP/"):
                      if code=="200": blocks.append(current)
                      parts=line.split(); code=parts[1] if len(parts)>1 else None; current={}
                  elif ":" in line and code:
                      k,v=line.split(":",1); current[k.strip().lower()]=v.strip()
              if code=="200": blocks.append(current)
              h=blocks[-1] if blocks else {}; data=p.read_bytes()
              return {"key":key,"source_url":url,"retrieved_at_utc":retrieved,"http_status":int(status),
                  "http_last_modified_header":h.get("last-modified"),"etag":h.get("etag"),
                  "size_bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          entries=[
              record(sys.argv[1],sys.argv[2],sys.argv[3],sys.argv[4],sys.argv[5],"geoNames_country_info"),
              record(sys.argv[6],sys.argv[7],sys.argv[8],sys.argv[9],sys.argv[10],"un_m49_overview")]
          Path(sys.argv[11]).write_text(json.dumps({"manifest_version":1,"sources":entries},indent=2)+"\n",encoding="utf-8")
          print(json.dumps(entries,indent=2))
          PY

      - name: Unit test source parser and crosswalk rules
        run: python3 -m unittest discover -s tests -p "test_geonames_un_m49_crosswalk_audit.py" -v

      - name: Compare GeoNames codes with official UN M49 table
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP_DIR/country-area-code-audit"
          python3 scripts/geonames-un-m49-crosswalk-audit.py \
            --country-info "$work/countryInfo.txt" \
            --m49-html "$work/un-m49-overview.html" \
            --source-manifest "$work/source-manifest.json" \
            --exception-dispositions docs/geonames-un-m49-exception-dispositions-2026-10-12.json \
            --output-dir "$work/output"
          python3 - "$work/output/country-area-code-crosswalk-aggregate.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("## Country/area alpha-code cross-check")
          print("- Status: "+report["status"])
          for key,value in report["counts"].items(): print(f"- {key}: {value}")
          print("- Direct ISO Country Codes Collection snapshot: not captured by this audit.")
          print("- UN M49 numeric codes are not treated as ISO numeric-3 proof.")
          print("- Automatic code replacement: not authorized.")
          rows_path = Path(sys.argv[1]).with_name("country-area-code-crosswalk-rows.json")
          rows = json.loads(rows_path.read_text(encoding="utf-8"))
          catalog_path = Path(sys.argv[1]).with_name("country-area-destination-catalog-candidate.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          counts = catalog.get("counts", {})
          required = {"source_country_info_rows": 252, "un_m49_coded_country_area_rows": 248, "m49_exact_pair_rows": 248, "current_destination_candidates": 250, "historical_reference_rows_nonselectable": 2, "total_source_records_accounted_for": 252, "source_tuple_exceptions_documented": 4, "operational_selectable_rows": 0, "unresolved_country_area_identities": 0}
          for key,value in required.items():
              if counts.get(key) != value:
                  raise SystemExit(f"Destination candidate package {key} expected {value}, got {counts.get(key)}")
          candidate_records = catalog.get("records", [])
          if len(candidate_records) != 252 or len({str(r.get("geonames_id")) for r in candidate_records}) != 252:
              raise SystemExit("Country/area destination candidate package must retain 252 unique source IDs exactly once.")
          if catalog.get("status") != "SOURCE_RECONCILED_CANDIDATE_ONLY__NOT_IMPORTED":
              raise SystemExit("Country/area candidate package has invalid operational status.")
          if any(r.get("operational_selectable") is not False for r in candidate_records):
              raise SystemExit("Candidate export must never claim that rows are already selectable in the live application.")
          exception_rows = [row for row in rows if row.get("source_side") == "GeoNames countryInfo" and row.get("match_status") != "MATCHED_ALPHA2_ALPHA3_PAIR"]
          undocumented = [row for row in exception_rows if row.get("exception_disposition_status") != "DOCUMENTED"]
          print("### GeoNames source-code exception dispositions")
          if undocumented:
              for row in undocumented:
                  print(f"- BLOCKED: {row.get('name')} — {row.get('alpha2')}/{row.get('alpha3')}; GeoNames ID {row.get('geonames_id')}; disposition missing")
              raise SystemExit("Undocumented source-code exception detected.")
          if not exception_rows:
              print("- No non-M49 GeoNames source rows.")
          for row in exception_rows:
              print(f"- {row.get('name')} — {row.get('canonical_display_name')}; role={row.get('catalog_role')}; status={row.get('catalog_status')}; selectable_as_destination={row.get('selectable_as_destination')}; source tuple preserved; no automatic replacement")
          print("- Current destination areas are kept independently searchable without making a sovereignty claim.")
          print("- Historical former entities remain inactive/nonselectable and are retained for historical reference.")
          print("\n## Country/area destination candidate package")
          print(f"- Source records accounted for: {counts['total_source_records_accounted_for']}/252")
          print(f"- Current destination candidates (proposal only): {counts['current_destination_candidates']}")
          print(f"- Historical references (nonselectable): {counts['historical_reference_rows_nonselectable']}")
