name: Phase 0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-integrity:
    name: Phase 0 CI / Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Phase 0 control-plane files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/database-migrations.md
          test -f scripts/validate-migrations.sh
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          test -f .github/workflows/ci.yml
          echo "Phase 0 control-plane files are present."

  secret-scan:
    name: Phase 0 CI / Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency scanning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  migration-validation:
    name: Phase 0 CI / Database migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate migration conventions
        shell: bash
        run: bash scripts/validate-migrations.sh
      - name: Verify security regression definition
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'has_function_privilege' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'ensure_rls' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'relrowsecurity' supabase/tests/phase_0_rls_auto_enable.sql
          echo "Security regression definition is present. Live execution is deferred until a non-production CI database target is approved."

  application-validation:
    name: Phase 0 CI / Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Detect application implementation
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  typecheck'; then npm run typecheck; else echo 'Typecheck: SKIPPED — no typecheck script.'; fi
      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  lint'; then npm run lint; else echo 'Lint: SKIPPED — no lint script.'; fi
      - name: Tests
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  test'; then npm test --if-present; else echo 'Tests: SKIPPED — no test script.'; fi
      - name: Production build
        if: steps.detect.outputs.has_app == 'true'
        run: npm run build
      - name: Upload static site build artifact
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-grid-static-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: No application implementation yet
        if: steps.detect.outputs.has_app == 'false'
        run: >-
          echo 'Application validation: SKIPPED — repository contains no application/package manifest yet; no fake tests were created.'

  geonames-current-admin-parent-path-audit:
    name: Phase 0 CI / GeoNames parent-path audit
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 27) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch and fingerprint official Japan and Kenya GeoNames country archives
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP_DIR/geonames-source"
          manifest="$RUNNER_TEMP_DIR/geonames-source/remote-source-manifest.json"
          printf '{"manifest_version":1,"remote_sources":[]}\n' > "$manifest"

          for country in JP KE; do
            url="https://download.geonames.org/export/dump/${country}.zip"
            archive="$RUNNER_TEMP_DIR/geonames-source/${country}.zip"
            headers="$RUNNER_TEMP_DIR/geonames-source/${country}.headers"
            retrieved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            status="$(curl --silent --show-error --location --fail --retry 3 --retry-all-errors \
              --dump-header "$headers" --output "$archive" --write-out '%{http_code}' "$url")"
            test "$status" = "200"
            unzip -tq "$archive"
            test -s "$archive"

            python - "$headers" "$archive" "$country" "$url" "$retrieved_at" "$status" "$manifest" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from datetime import timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          headers_path, archive_path, country, url, retrieved_at, status, manifest_path = sys.argv[1:]
          raw_headers = Path(headers_path).read_text(encoding="iso-8859-1", errors="replace")
          last_block = {}
          current = {}
          current_status = None
          for line in raw_headers.replace("\r\n", "\n").split("\n"):
              if line.startswith("HTTP/"):
                  if current_status == "200":
                      last_block = current
                  parts = line.split()
                  current_status = parts[1] if len(parts) > 1 else None
                  current = {}
              elif ":" in line and current_status:
                  key, value = line.split(":", 1)
                  current[key.strip().lower()] = value.strip()
          if current_status == "200":
              last_block = current

          archive = Path(archive_path)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          last_modified_raw = last_block.get("last-modified")
          last_modified_utc = None
          if last_modified_raw:
              try:
                  dt = parsedate_to_datetime(last_modified_raw)
                  if dt.tzinfo is not None:
                      last_modified_utc = dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
              except (TypeError, ValueError, OverflowError):
                  last_modified_utc = None

          record = {
              "country_code": country,
              "archive_filename": archive.name,
              "source_url": url,
              "retrieved_at_utc": retrieved_at,
              "http_status": int(status),
              "http_last_modified_header": last_modified_raw,
              "http_last_modified_utc": last_modified_utc,
              "etag": last_block.get("etag"),
              "archive_sha256": digest,
              "archive_size_bytes": archive.stat().st_size,
              "zip_crc_validation": "PASS",
          }
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          manifest["remote_sources"].append(record)
          Path(manifest_path).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "country_code": country,
              "http_status": record["http_status"],
              "archive_sha256": digest,
              "archive_size_bytes": archive.stat().st_size,
              "http_last_modified_utc": last_modified_utc,
              "zip_crc_validation": "PASS",
          }))
          PY

            extract_dir="$RUNNER_TEMP_DIR/geonames-source/${country}"
            mkdir -p "$extract_dir"
            unzip -oq "$archive" -d "$extract_dir"
            test -s "$extract_dir/${country}.txt"
          done

          cat "$RUNNER_TEMP_DIR/geonames-source/JP/JP.txt" "$RUNNER_TEMP_DIR/geonames-source/KE/KE.txt" > "$RUNNER_TEMP_DIR/geonames-source/JP_KE_allCountries_subset.txt"
          echo "Combined official-source subset SHA-256:"
          sha256sum "$RUNNER_TEMP_DIR/geonames-source/JP_KE_allCountries_subset.txt"

      - name: Run read-only exact-code hierarchy audit
        shell: bash
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node scripts/geonames-current-admin-parent-path-audit.mjs \
            "$RUNNER_TEMP_DIR/geonames-source/JP_KE_allCountries_subset.txt" \
            docs/geonames-sample-validation/results/crosswalk-reconciliation-20261010/owner-approved-dispositions.csv \
            "$RUNNER_TEMP_DIR/current-admin-parent-path-audit" \
            "$RUNNER_TEMP_DIR/geonames-source/remote-source-manifest.json"
          cat "$RUNNER_TEMP_DIR/current-admin-parent-path-audit.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload row-level audit and retrieval manifest (no source archives)
        uses: actions/upload-artifact@v4
        with:
          name: geonames-parent-path-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/current-admin-parent-path-audit.csv
            ${{ runner.temp }}/current-admin-parent-path-audit.json
            ${{ runner.temp }}/geonames-source/remote-source-manifest.json
          if-no-files-found: error
          retention-days: 7
