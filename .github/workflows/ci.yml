name: Phase 0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/isco08-occupation-catalog-foundation"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-integrity:
    name: Phase 0 CI / Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Phase 0 control-plane files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/database-migrations.md
          test -f scripts/validate-migrations.sh
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          test -f .github/workflows/ci.yml
          echo "Phase 0 control-plane files are present."

  secret-scan:
    name: Phase 0 CI / Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency scanning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  migration-validation:
    name: Phase 0 CI / Database migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate migration conventions
        shell: bash
        run: bash scripts/validate-migrations.sh
      - name: Verify security regression definition
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'has_function_privilege' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'ensure_rls' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'relrowsecurity' supabase/tests/phase_0_rls_auto_enable.sql
          echo "Security regression definition is present. Live execution is deferred until a non-production CI database target is approved."

  application-validation:
    name: Phase 0 CI / Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Detect application implementation
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  typecheck'; then npm run typecheck; else echo 'Typecheck: SKIPPED — no typecheck script.'; fi
      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  lint'; then npm run lint; else echo 'Lint: SKIPPED — no lint script.'; fi
      - name: Tests
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  test'; then npm test --if-present; else echo 'Tests: SKIPPED — no test script.'; fi
      - name: Production build
        if: steps.detect.outputs.has_app == 'true'
        run: npm run build
      - name: Upload static site build artifact
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-grid-static-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: No application implementation yet
        if: steps.detect.outputs.has_app == 'false'
        run: >-
          echo 'Application validation: SKIPPED — repository contains no application/package manifest yet; no fake tests were created.'

  sync-isco08-official-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/isco08-occupation-catalog-foundation'
    name: Phase 0 CI / Official ISCO-08 source synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/isco08-occupation-catalog-foundation
      - name: Synchronize code, title and hierarchy fields from the official ILO CSV
        run: python3 scripts/sync_isco08_from_ilo.py
      - name: Validate exact ILO source match and pending production gates
        run: python3 scripts/validate_isco08_source.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build preview assets
        run: npm run build
      - name: Commit synchronized catalogue only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/occupations/isco-08-unit-groups.csv
          git add data/occupations/isco-08-source-manifest.json
          git add data/occupations/README.md
          git add public/data/occupations-isco08-review.json
          git add occupations-preview.html
          if git diff --cached --quiet; then
            echo "The catalogue already matches the official ILO source; no commit needed."
          else
            git commit -m "data(occupations): sync titles from official ILO ISCO-08 source"
            git push origin HEAD:feat/isco08-occupation-catalog-foundation
          fi
