name: Phase 0 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-integrity:
    name: Phase 0 CI / Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Phase 0 control-plane files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/database-migrations.md
          test -f scripts/validate-migrations.sh
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          test -f .github/workflows/ci.yml
          echo "Phase 0 control-plane files are present."

  secret-scan:
    name: Phase 0 CI / Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency scanning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  migration-validation:
    name: Phase 0 CI / Database migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate migration conventions
        shell: bash
        run: bash scripts/validate-migrations.sh
      - name: Verify security regression definition
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'has_function_privilege' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'ensure_rls' supabase/tests/phase_0_rls_auto_enable.sql
          grep -q 'relrowsecurity' supabase/tests/phase_0_rls_auto_enable.sql
          echo "Security regression definition is present. Live execution is deferred until a non-production CI database target is approved."

  application-validation:
    name: Phase 0 CI / Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Detect application implementation
        id: detect
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  typecheck'; then npm run typecheck; else echo 'Typecheck: SKIPPED — no typecheck script.'; fi
      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  lint'; then npm run lint; else echo 'Lint: SKIPPED — no lint script.'; fi
      - name: Tests
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^  test'; then npm test --if-present; else echo 'Tests: SKIPPED — no test script.'; fi
      - name: Production build
        if: steps.detect.outputs.has_app == 'true'
        run: npm run build
      - name: Upload static site build artifact
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-grid-static-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: No application implementation yet
        if: steps.detect.outputs.has_app == 'false'
        run: >-
          echo 'Application validation: SKIPPED — repository contains no application/package manifest yet; no fake tests were created.'

  database-certification:
    name: Phase 0 CI / Isolated PostgreSQL certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_grid_certification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_grid_certification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: job_grid_certification
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Confirm isolated database target
        run: |
          set -euo pipefail
          test "$(psql -XAtq -c 'SELECT current_database()')" = "job_grid_certification"
          test "$(psql -XAtq -c 'SELECT current_user')" = "postgres"
          echo "PASS: connected only to isolated GitHub Actions PostgreSQL service"
      - name: Apply real baseline migrations and certify PR #45
        run: bash scripts/database-certification.sh
