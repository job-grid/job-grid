          import csv
          import hashlib
          import html
          import json
          import re
          import sys
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from email.utils import parsedate_to_datetime

          root = Path(sys.argv[1])
          audit_path = Path(sys.argv[2])
          json_out = Path(sys.argv[3])
          csv_out = Path(sys.argv[4])
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          retrieved_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          sources = [
              {
                  "key": "mlit-adminarea-current",
                  "title": "MLIT National Land Numerical Information — AdminAreaCd",
                  "url": "https://nlftp.mlit.go.jp/ksj/jpgis/codelist/AdminAreaCd.html",
                  "as_of_date": "Not stated in filename; treat as the publisher's current page snapshot only",
                  "html_path": root / "mlit-adminarea-current.html",
                  "headers_path": root / "mlit-adminarea-current.headers",
              },
              {
                  "key": "mlit-adminarea-1990-10-01",
                  "title": "MLIT National Land Numerical Information — AdministrativeAreaCd",
                  "url": "https://nlftp.mlit.go.jp/ksj/gmlold/codelist/AdministrativeAreaCd_901001.html",
                  "as_of_date": "1990-10-01",
                  "html_path": root / "mlit-adminarea-1990-10-01.html",
                  "headers_path": root / "mlit-adminarea-1990-10-01.headers",
              },
              {
                  "key": "mlit-adminarea-1975-10-01",
