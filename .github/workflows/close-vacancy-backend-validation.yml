name: Close Job backend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/close-vacancy/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/vacancy_close_*.sql"
      - "tests/close-vacancy-backend-contract.test.js"
      - "docs/close-vacancy-supabase-integration.md"
      - ".github/workflows/close-vacancy-backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    name: Close Job / SQL and Edge Function validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_grid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_grid_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check trusted Edge Function
        run: deno check --no-lock --config supabase/functions/close-vacancy/deno.json supabase/functions/close-vacancy/index.ts
      - name: Test Edge Function request boundary without live credentials
        run: deno test --no-lock --config supabase/functions/close-vacancy/deno.json supabase/functions/close-vacancy/index.test.ts
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run repository and backend-contract tests
        run: npm test
      - name: Validate migration naming and destructive-operation policy
        run: bash scripts/validate-migrations.sh
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated test roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/vacancy_close_bootstrap.sql
      - name: Parse and execute proposed migration against disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012214500_vacancy_close_foundation.sql
      - name: Exercise authorization, transitions, audit, idempotency and RLS
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/vacancy_close_integration.sql
      - name: Exercise concurrent idempotent retries
        run: bash supabase/tests/vacancy_close_concurrency.sh
