name: Sync ISCO-08 from official ILO source

on:
  push:
    branches:
      - "feat/isco08-occupation-catalog-foundation"
    paths:
      - "scripts/sync_isco08_from_ilo.py"
      - ".github/workflows/sync-isco08-from-ilo.yml"

permissions:
  contents: write

jobs:
  sync-official-catalogue:
    if: github.ref == 'refs/heads/feat/isco08-occupation-catalog-foundation'
    name: Sync and validate official ISCO-08 data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/isco08-occupation-catalog-foundation
      - name: Synchronize official ILO code, title and hierarchy fields
        run: python3 scripts/sync_isco08_from_ilo.py
      - name: Verify exact source match and data gates
        run: python3 scripts/validate_isco08_source.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit only synchronized catalogue outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/occupations/isco-08-unit-groups.csv \
            data/occupations/isco-08-source-manifest.json \
            data/occupations/README.md \
            public/data/occupations-isco08-review.json \
            occupations-preview.html
          if git diff --cached --quiet; then
            echo "The catalogue already matches the official ILO source; no commit needed."
          else
            git commit -m "data(occupations): sync titles from official ILO ISCO-08 source"
            git push origin HEAD:feat/isco08-occupation-catalog-foundation
          fi
