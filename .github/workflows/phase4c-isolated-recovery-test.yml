name: Phase 4C isolated recovery test

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: "Existing Phase 4C backup identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery-test:
    name: Phase 4C / isolated recovery validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: phase4c-recovery-approved
      deployment: false
    env:
      RECOVERY_PROJECT_REF: ${{ secrets.RECOVERY_PROJECT_REF }}
      RECOVERY_POSTGRES_HOST: ${{ secrets.RECOVERY_POSTGRES_HOST }}
      RECOVERY_POSTGRES_PORT: ${{ secrets.RECOVERY_POSTGRES_PORT }}
      RECOVERY_POSTGRES_DB: ${{ secrets.RECOVERY_POSTGRES_DB }}
      RECOVERY_POSTGRES_USER: ${{ secrets.RECOVERY_POSTGRES_USER }}
      RECOVERY_POSTGRES_PASSWORD: ${{ secrets.RECOVERY_POSTGRES_PASSWORD }}
      BACKUP_R2_ENDPOINT_URL: https://6952ddf46cc39605326ecf0583cde02e.r2.cloudflarestorage.com
      BACKUP_R2_BUCKET: job-grid-backups
      BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      GITHUB_ACTIONS: "true"
      GITHUB_ENVIRONMENT: phase4c-recovery-approved

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /etc/apt/keyrings/postgresql.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          test "$(command -v pg_restore)" = "/usr/lib/postgresql/17/bin/pg_restore"

      - name: Install pinned recovery dependencies
        run: python -m pip install -r scripts/phase4c/requirements-backup.txt

      - name: Compile recovery procedure and run offline validation tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase4c/recovery_procedure.py scripts/phase4c/test_recovery_procedure.py
          PYTHONPATH=scripts/phase4c python -m unittest scripts/phase4c/test_recovery_procedure.py -v

      - name: Execute isolated recovery test
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/phase4c python -m recovery_procedure --backup-id "${{ inputs.backup_id }}"
