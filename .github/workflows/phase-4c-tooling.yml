name: Phase 4C tooling validation

on:
  push:
    branches:
      - phase-4c-implementation
      - fix/phase4c-dns-address-family-preflight
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tooling-only:
    name: Phase 4C tooling-only static/unit validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Phase 4C test dependencies
        run: python3 -m pip install -r scripts/phase4c/requirements-backup.txt

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/phase4c/phase4c_tooling.py scripts/phase4c/production_preflight.py scripts/phase4c/backup_executor.py scripts/phase4c/recovery_procedure.py scripts/phase4c/test_phase4c_tooling.py scripts/phase4c/test_dns_preflight.py

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/phase4c -p 'test_*.py' -v

      - name: Implementation-stage boundary
        run: |
          set -euo pipefail
          python3 scripts/phase4c/phase4c_tooling.py --self-check
          echo "backup execution: NOT RUN"
          echo "production database access: NOT RUN"
          echo "R2 access: NOT RUN"
          echo "restore: NOT RUN"
