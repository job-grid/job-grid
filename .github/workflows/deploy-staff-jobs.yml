name: Deploy staff vacancy function

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY-STAFF-JOBS to deploy the staff function"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staff-jobs:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY-STAFF-JOBS'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Confirm required credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing production environment secret SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing production environment secret SUPABASE_DB_PASSWORD" >&2; exit 1; }
      - name: Link approved production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref tnrdovdhlwitjzecduxa --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy staff-jobs Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy staff-jobs --project-ref tnrdovdhlwitjzecduxa
